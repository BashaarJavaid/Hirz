name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  python-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked mypy --strict hirz/ scripts/ alembic/

  python-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: hirz-ci-${{ github.run_id }}-${{ github.run_attempt }}
      HIRZ_LLM: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - name: Build pinned native Dogwood (required)
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 uv run --locked python scripts/build_dogwood.py
          echo "HIRZ_DOGWOOD=$PWD/.tools/dogwood" >> "$GITHUB_ENV"
      - name: Service-free tests with coverage
        run: uv run --locked pytest
      - name: Initialize disposable PostgreSQL and Home Assistant demo
        run: uv run --locked python scripts/init_dev.py
      - name: Build and start Hirz with readiness checks
        run: docker compose -f compose.dev.yml up -d --build --wait --wait-timeout 180
      - name: MCP client SDK handshake and onboarding
        run: uv run --locked python scripts/smoke_mcp.py
      - name: Local OAuth SDK linking and refresh in a disposable database
        run: uv run --locked python scripts/smoke_oauth.py
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked hirz doctor
      - run: uv run --locked python scripts/check_dev.py
      - name: Live PostgreSQL tests in disposable databases
        run: uv run --locked pytest -m integration --cov=hirz --cov-append
      - name: 80 percent combined coverage gate
        run: uv run --locked coverage report --fail-under=80
      - name: Service status on failure (no configuration or raw logs)
        if: failure()
        run: >-
          docker ps -a
          --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"
          --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
      - name: Remove only this runner's Compose resources and credentials
        if: always()
        run: |
          trap 'rm -f .env' EXIT
          if [ -f .env ]; then
            docker compose -f compose.dev.yml down --volumes --remove-orphans
          fi

  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HIRZ_LLM: "off"
      COMPOSE_PROJECT_NAME: hirz-scenarios-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - name: Build pinned native Dogwood (required)
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 uv run --locked python scripts/build_dogwood.py
          echo "HIRZ_DOGWOOD=$PWD/.tools/dogwood" >> "$GITHUB_ENV"
      - name: Initialize isolated PostgreSQL and HA demo
        run: uv run --locked python scripts/init_dev.py
      - name: Scoped evening execution and observation regressions
        run: |
          uv run --locked hirz scenario run scenarios/demo-evening.yaml --headless --assert --output "$RUNNER_TEMP/evening.json" > /dev/null
          uv run --locked hirz scenario run scenarios/demo-evening-hourly.yaml --headless --assert --output "$RUNNER_TEMP/hourly.json" > /dev/null
          uv run --locked hirz scenario run scenarios/parents-scam-check.yaml --headless --assert --output "$RUNNER_TEMP/parents.json" > /dev/null
      - name: Report scoped results and explicit deferrals
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for name in ("evening", "hourly", "parents"):
                  result = json.loads((Path(os.environ["RUNNER_TEMP"]) / f"{name}.json").read_text())
                  print(f"{name}: {result['status']}; checks={len(result['checks'])}; deferred assertions={len(result['deferred'])}", file=summary)
              print("Evening: internal service execution; Hourly: planning regression; parents: observation checks. MCP, authentication, trust, security and Link remain deferred.", file=summary)
          PYTHON

      - name: Live HA lamp and bounded restoration
        run: uv run --locked python scripts/smoke_scenario.py --live-demo --artifacts-dir "$RUNNER_TEMP/ha-scenario"
      - name: Remove only this runner's isolated services
        if: always()
        run: |
          trap 'rm -f .env' EXIT
          if [ -f .env ]; then
            docker compose -f compose.dev.yml down --volumes --remove-orphans
          fi

  ts-lint-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck

  ts-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - name: Browser coverage awaits Phase 5
        run: |
          echo 'DEFERRED: No Playwright, companion, simulator, or voice-only checks ran. Phase 5 adds these surfaces and browser tests.' | tee -a "$GITHUB_STEP_SUMMARY"

  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HIRZ_LLM: "off"
      COMPOSE_PROJECT_NAME: hirz-conformance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out reviewed independent checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BashaarJavaid/addon-check
          ref: c8b65e0977204883d2ec23d5ac0f7a08300d021e
          path: .tools/addon-check
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Build locked checker
        working-directory: .tools/addon-check
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - name: Build pinned native Dogwood (required)
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 uv run --locked python scripts/build_dogwood.py
          echo "HIRZ_DOGWOOD=$PWD/.tools/dogwood" >> "$GITHUB_ENV"
      - name: Initialize isolated PostgreSQL and HA demo
        run: uv run --locked python scripts/init_dev.py
      - name: Twelve-tool conformance, restart and signed audit verification
        run: >-
          uv run --locked python scripts/smoke_household_tools.py
          --audit-output "$RUNNER_TEMP/conformance-audit.json"
          --conformance-cli "$PWD/.tools/addon-check/dist/cli.js"
      - name: Publish payload-free conformance summary
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "conformance-audit.conformance.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("addon-check: " + json.dumps(report["summary"]), file=summary)
              print("Twelve output/speech cases; only onboarding/context timed. Scoped evidence, not Amazon certification. Full latency/isolation remains item 26.", file=summary)
          PYTHON
      - name: Service status on failure (no configuration or raw logs)
        if: failure()
        run: >-
          docker ps -a
          --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"
          --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
      - name: Remove only this runner's isolated services and credentials
        if: always()
        run: |
          trap 'rm -f .env' EXIT
          if [ -f .env ]; then
            docker compose -f compose.dev.yml down --volumes --remove-orphans
          fi

  latency:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        scenario: [demo-evening, demo-evening-hourly]
    env:
      HIRZ_LLM: "off"
      HIRZ_BUDGET_SCENARIO: ${{ matrix.scenario }}
      COMPOSE_PROJECT_NAME: hirz-latency-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - name: Build pinned native Dogwood
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 uv run --locked python scripts/build_dogwood.py
          echo "HIRZ_DOGWOOD=$PWD/.tools/dogwood" >> "$GITHUB_ENV"
      - name: Initialize isolated local services
        run: |
          uv run --locked python scripts/init_dev.py
          docker compose -f compose.dev.yml up -d --wait postgres
      - name: All twelve tools, every case at warm p95 <= 250 ms
        run: HIRZ_BUDGET_ARTIFACTS="$RUNNER_TEMP/tool-budget" uv run --locked pytest tests/latency -m latency --no-cov -s
      - name: Payload-free timing summary
        if: always()
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "tool-budget" / os.environ["HIRZ_BUDGET_SCENARIO"] / "report.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if not path.exists():
                  print("No completed timing report; item 26 gate did not pass.", file=summary)
              else:
                  report = json.loads(path.read_text())
                  print(report["protocol"], file=summary)
                  print(report["protocol"])
                  print("Local tool budget: " + report["status"], file=summary)
                  for scenario, result in report["scenarios"].items():
                      for group in ("cases", "tools"):
                          lines = [
                              f"\n{scenario} / {group} — raw round-trip milliseconds\n",
                              "| Name | n | Min | Median | p95 | Max | Gate | SDK n | SDK median | SDK p95 | SDK max |",
                              "|---|---:|---:|---:|---:|---:|---|---:|---:|---:|---:|",
                          ]
                          for name, stats in result.get("latency", {}).get(group, {}).items():
                              gate = "PASS" if stats["p95_ms"] <= report["budget_ms"] else "FAIL"
                              sdk = stats.get("sdk")
                              reference = f"{sdk['count']} | {sdk['median_ms']:.3f} | {sdk['p95_ms']:.3f} | {sdk['max_ms']:.3f}" if sdk else "— | — | — | —"
                              lines.append(f"| {name} | {stats['count']} | {stats['min_ms']:.3f} | {stats['median_ms']:.3f} | {stats['p95_ms']:.3f} | {stats['max_ms']:.3f} | {gate} | {reference} |")
                          print("\n".join(lines), file=summary)
                          print("\n".join(lines))
                  print("Five warmups and 100 measured calls per case; nearest-rank p95; no discarded samples. Local twin evidence, not AWS cold start. Private evidence is not uploaded.", file=summary)
          PYTHON
      - name: Remove only this runner's services and credentials
        if: always()
        run: |
          trap 'rm -f .env' EXIT
          if [ -f .env ]; then
            docker compose -f compose.dev.yml down --volumes --remove-orphans
          fi

  cedar-conform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - name: Build pinned native Dogwood (required)
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 uv run --locked python scripts/build_dogwood.py
          echo "HIRZ_DOGWOOD=$PWD/.tools/dogwood" >> "$GITHUB_ENV"
      - name: Native gate and 200 deterministic examples per property
        run: uv run --locked pytest tests/cedar_conformance tests/unit/test_constitution.py --no-cov
      - name: AWS comparison remains item 37
        run: echo 'Local Dogwood/compiler checks ran; AgentCore comparison is deferred to item 37.' >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - run: uv build
      - name: Fresh-wheel import and CLI outside the checkout
        run: |
          wheel=$(realpath dist/*.whl)
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" "$wheel"
          cd "$RUNNER_TEMP"
          ./wheel-smoke/bin/python -c 'import hirz; from importlib.metadata import version; print("PASS installed hirz", version("hirz"))'
          ./wheel-smoke/bin/python -c 'from hirz.risk import CLASSES; from hirz.constitution.preview import SITUATIONS; assert len(CLASSES) == len(SITUATIONS) == 36; print("PASS packaged catalogs: 36 classes, 36 situation groups")'
          ./wheel-smoke/bin/hirz --help
      - run: docker build --tag hirz-ci:check .
      - name: Container runs as the existing unprivileged user
        run: docker run --rm --entrypoint python hirz-ci:check -c 'import os; assert os.getuid() == 10001; print("PASS container UID", os.getuid())'
      - name: Frontend bundles await Phase 5
        run: |
          echo 'DEFERRED: No MCP App or companion bundle was built. Phase 5 adds the frontend build scripts.' | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Phase 0 placeholder — publishing not configured
        run: |
          echo 'DEFERRED: No release was published and no CDK artifact was synthesized. Phase 7 adds tag-gated ECR publication and CDK synthesis; this placeholder runs on every event.' | tee -a "$GITHUB_STEP_SUMMARY"
