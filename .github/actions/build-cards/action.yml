name: Build browser assets
description: Build the five MCP cards and the companion assets before authenticated startup or packaging
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24.21.0"
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: false
        run_install: false
    - run: pnpm install --frozen-lockfile && pnpm --filter mcp-app build && pnpm --filter web build
      shell: bash
