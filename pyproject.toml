[project]
name = "hirz"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "alembic==1.20.0",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.3",
    "sqlalchemy[asyncio]==2.0.54",
    "uvicorn==0.53.0",
    "rfc8785==0.1.4",
    "websockets==17.1",
    "scipy==1.18.0",
    "boto3==1.43.90",
    "mcp==1.30.0",
    "PyJWT[crypto]==2.14.0",
]

[project.scripts]
hirz = "hirz.cli:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "build_backend"
backend-path = ["."]

[tool.uv.build-backend]
module-root = ""
source-include = ["build_backend.py", "hirz/mcp/ui/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hirz", "scripts", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not latency' --cov=hirz --cov-report=term-missing"
markers = [
    "integration: requires local Postgres; creates only a disposable test database",
    "latency: authenticated disposable PostgreSQL benchmark; run explicitly without coverage",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "strands-agents==1.57.0",
    "types-PyYAML==6.0.12.20260906",
]
