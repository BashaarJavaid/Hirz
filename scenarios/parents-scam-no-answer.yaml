# Explicitly simulated no-answer scenario; real-delivery evidence is separate.
id: parents-scam-no-answer
seed: 20261013
household: ../constitutions/quinn-parents.yaml
clock:
  start: '2026-10-13T17:30:00-05:00'
  end: '2026-10-13T17:40:00-05:00'
  speed: 60
adapters:
  devices: twin
  ev: twin
  energy: twin
  presence: twin
  wearable: twin
  calendar: twin
  contacts: twin
  doorbell: twin
rate_plan: twin
execution:
  full_sequence: true
  member: mom
  rooms: {}
  verified_app_fixtures: [malik]
initial:
  base_load_kw: 0.4
  weather:
    start: '2026-10-13T17:30:00-05:00'
    end: '2026-10-13T17:55:00-05:00'
    samples:
    - at: '2026-10-13T17:30:00-05:00'
      temp_f: 65.6
      cloud_cover_percent: 100
  tariff:
    periods:
    - start_minute: 0
      end_minute: 1440
      import_cents_per_kwh: 10
      band: synthetic-base
      export_cents_per_kwh: null
    slot_minutes: 60
    spike_probability: 0
    spike_min_cents: 0
    spike_max_cents: 0
  evs: {}
  batteries: {}
  zones: {}
  solar: {}
  appliances: {}
  devices:
    lock.front_door:
      state:
        available: true
        locked: true
      delays:
        lock: 1.5
        unlock: 1.5
      fail_next: null
    doorbell.front_door:
      state:
        available: true
      delays: {}
      fail_next: null
  presence:
    mom:
      present: true
      sleeping: false
      zone_id: null
    dad:
      present: true
      sleeping: false
      zone_id: null
  weekly:
    mom: []
    dad: []
  recovery:
    mom:
      score: 75
      mean: 75
      rho: 0.7
      noise_sd: 5
    dad:
      score: 75
      mean: 75
      rho: 0.7
      noise_sd: 5
  couplings: []
  overrides: []
  contact_scripts: []
  inbound_calls: []
timeline:
- at: '17:34'
  event: call.inbound
  presented_number: +1 312 555 0199
  claim: Malik in trouble, needs five hundred dollars
- at: '17:35'
  event: voice
  member: mom
  text: Malik just called from a strange number. He says he's in trouble and needs
    five hundred dollars. Is it really him?
  script:
  - tool: assess_request_risk
    arguments: {text: "Malik called from a strange number and needs five hundred dollars", claimed_party: Malik, party: person, request_id: no-answer-assessment}
    save_as: case
  - tool: verify_trusted_identity
    confirmed: true
    arguments: {operation: start, case_id: $case, request_id: no-answer-check}
    save_as: pending
- at: '17:37'
  event: contact.checkin_reply
  contact: malik
  reply: no_answer
  requested_at: '17:35'
  deadline: '17:37'
- at: '17:38'
  event: voice
  member: mom
  text: Alexa, is it him?
  script:
  - tool: verify_trusted_identity
    arguments: {operation: status, case_id: $case}
    save_as: answer
assert:
  checks:
  - at: '17:30'
    kind: observation
    equals:
      present: true
      sleeping: false
    domain: presence
    subject: mom
  - at: '17:30'
    kind: observation
    equals:
      present: true
      sleeping: false
    domain: presence
    subject: dad
  - at: '17:30'
    kind: call
    equals:
      count: 0
  - at: '17:34'
    kind: call
    equals:
      count: 1
  - at: '17:35'
    kind: contact
    equals:
      status: pending
    subject: malik
  - at: '17:38'
    kind: contact
    subject: malik
    equals:
      status: no_answer
  - at: '17:36'
    kind: verification
    equals: {risk_band: critical, status: pending, presented_number: null}
  - at: '17:37'
    kind: verification
    equals: {risk_band: critical, status: no_answer, presented_number: null}
  - at: '17:38'
    kind: result
    subject: $answer
    equals:
      wording_contains: ["Do not send anything", "call the contact saved in your own phone"]
  deferred: []
  never: ["EXECUTE:finance.*", "EXECUTE:security.door_unlock"]
# The authenticated MCP replay and saved-number wording assertion run in
# tests/integration/test_trusted_checkins.py::test_no_answer_scenario_through_authenticated_mcp.
